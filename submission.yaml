submission:
  title: "Veno-Pump Clinical Monitoring & Intelligent Rehabilitation Platform"

  problem_statement: >
    Patients undergoing lower-limb venous and post-surgical rehabilitation face poor therapy adherence, unmonitored symptom escalation (pain, swelling, heaviness, fatigue), and sparse follow-ups. Clinicians lack continuous longitudinal session data to detect non-compliance, worsening venous symptoms, or rehabilitation risks between periodic clinic visits.

  solution_summary: >
    Veno-Pump is a clinical monitoring and decision support web platform built for lower-limb rehabilitation. It tracks simulated session adherence, symptom progression, and risk flags across a patient cohort, leveraging IBM watsonx.ai (IBM Granite 4 H Small) and grounded deterministic clinical metrics to deliver grounded decision-support insights, AI-assisted clinician queries, and structured reports.

  key_features:
    - "Longitudinal patient monitoring with 28-day adherence tracking and week-over-week trend analysis"
    - "Multi-symptom outcome progression tracking across pain, oedema/swelling, heaviness, and fatigue"
    - "Automated clinical risk stratification engine flagging adherence drops, symptom worsening, and incomplete sessions"
    - "AI-powered clinical decision support generating grounded patient and cohort insights using IBM watsonx.ai (IBM Granite 4 H Small)"
    - "Interactive clinician AI assistant and one-click structured clinical summary report generation"

  tech_stack:
    languages: ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "Tailwind CSS", "TanStack Query", "Recharts", "SQLModel"]
    ibm_technologies: ["IBM watsonx.ai", "IBM Granite 4 H Small", "IBM Bob"]
    databases: ["SQLite"]
    other: ["Vercel", "Render", "REST API", "Pydantic", "Axios", "Lucide React"]

  what_we_are_most_proud_of: >
    We are proud of creating a clinician-centric decision support architecture that combines deterministic backend calculation of adherence and risk metrics with IBM watsonx.ai Granite inference. The AI is grounded in authoritative application metrics rather than being asked to independently calculate clinical values, while a deterministic fallback keeps the platform usable when external AI inference is unavailable.

  known_limitations: >
    This platform is a hackathon prototype operating on synthetic patient cohorts and simulated rehabilitation sessions. The physical Veno-Pump wearable sleeve is a future hardware integration concept and is not physically connected. AI outputs provide clinical decision support only and do not constitute autonomous medical diagnosis or prescription.

